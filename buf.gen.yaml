version: v2

managed:
  enabled: true
  override:
    - file_option: go_package_prefix
      value: github.com/JonathanHHenson/my-first-mud/server/gen

clean: true

plugins:
  - remote: buf.build/protocolbuffers/go
    out: server/gen
    opt:
      - paths=source_relative

  - remote: buf.build/bufbuild/es
    out: client/src/gen
    opt:
      - target=ts
